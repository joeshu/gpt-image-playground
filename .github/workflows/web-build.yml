name: build-web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - name: Install frontend dependencies
        working-directory: web-react
        run: npm ci
      - name: Build published React Web
        working-directory: web-react
        env:
          VITE_COMPAT_API_ROOT: ''
        run: npm run build
      - name: Publish dist into repository
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web-react/dist
          git diff --cached --quiet || git commit -m "build: publish React web dist"
          git push
