<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPT Image Playground</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--line:#30363d;--muted:#8b949e;--text:#f0f6fc;--accent:#58a6ff;--good:#3fb950;--bad:#f85149}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#0d1117,#111827 55%,#0d1117);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}main{max-width:1180px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.title{font-size:clamp(28px,5vw,46px);font-weight:750;letter-spacing:-.04em;margin:3px 0}.sub{color:var(--muted);margin:0}.health{font-size:12px;color:var(--muted);white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}.dot.ok{background:var(--good)}.grid{display:grid;grid-template-columns:minmax(310px,390px) 1fr;gap:18px}.panel{background:rgba(22,27,34,.9);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 40px #0003}.panel h2{font-size:16px;margin:0 0 16px}.field{margin:0 0 14px}.field>label{display:block;color:#c9d1d9;font-size:13px;margin-bottom:6px}.hint{color:var(--muted);font-size:12px;margin-top:4px}textarea,input,select{width:100%;background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;outline:none}textarea{min-height:130px;resize:vertical}textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #58a6ff22}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks{display:flex;gap:14px;flex-wrap:wrap;color:#c9d1d9;font-size:13px}.checks label{display:flex;gap:6px;align-items:center}.checks input{width:auto}.filebox{border:1px dashed #48515c;border-radius:10px;padding:11px;background:#0d1117}.previews{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.thumb{width:58px;height:58px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}button{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:#07111f;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.12)}button:disabled{opacity:.5;cursor:wait}.secondary{background:#21262d;color:var(--text);border:1px solid var(--line)}.actions{display:flex;gap:8px;align-items:center;margin-top:16px}.status{font-size:13px;color:var(--muted);min-height:21px}.status.good{color:var(--good)}.status.bad{color:var(--bad)}.results{min-height:360px}.empty{height:320px;border:1px dashed #30363d;border-radius:12px;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.card{background:#0d1117;border:1px solid var(--line);border-radius:11px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#161b22}.card p{font-size:11px;color:var(--muted);padding:8px;margin:0;word-break:break-all}.history{margin-top:18px}.history-list{display:grid;gap:7px}.history-item{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#0d1117;color:#c9d1d9;cursor:pointer}.history-item:hover{border-color:var(--accent)}.history-item small{display:block;color:var(--muted)}.raw{white-space:pre-wrap;overflow:auto;max-height:260px;background:#0d1117;border-radius:9px;border:1px solid var(--line);padding:11px;color:#c9d1d9;font-size:12px;margin-top:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.results{min-height:250px}}
</style>
<style>
.mask-modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:10}.mask-card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:16px;max-width:min(92vw,900px)}#maskCanvas{max-width:82vw;max-height:65vh;background:#fff;touch-action:none}.mask-tools{display:flex;gap:8px;margin:10px 0;align-items:center}
</style>
</head>
<body><main>
<header class="top"><div><div class="eyebrow">local creative workstation</div><h1 class="title">GPT Image Playground</h1><p class="sub">把提示词、参考图和 Agent 任务变成可追踪的生成 Job。</p></div><div class="health"><span class="dot" id="healthDot"></span><span id="healthText">连接检测中</span></div></header>
<section class="grid"><div class="panel"><h2>创建任务</h2>
<div class="field"><label for="mode">模式</label><select id="mode"><option value="generate">单图生成</option><option value="batch">批量生成（每行一个提示词）</option><option value="agent">Agent 多轮编排</option></select></div>
<div class="field"><label for="prompt">提示词</label><textarea id="prompt" placeholder="例如：一张极简风格的山间湖泊电影海报，冷色调，留出标题区域"></textarea><div class="hint" id="promptHint">描述你想要的画面、主体、构图和风格。</div></div>
<div class="row"><div class="field"><label for="profile">Profile</label><select id="profile"></select></div><div class="field"><label for="style">风格预设</label><select id="style"><option value="">默认</option><option value="watercolor">watercolor</option><option value="cinematic">cinematic</option><option value="poster">poster</option><option value="product">product</option></select></div></div>
<div class="row"><div class="field"><label for="size">尺寸</label><select id="size"><option value="1:1">1:1</option><option value="16:9">16:9</option><option value="9:16">9:16</option><option value="4:3">4:3</option><option value="3:4">3:4</option></select></div><div class="field"><label for="quality">质量</label><select id="quality"><option value="low">low</option><option value="medium">medium</option><option value="high">high</option></select></div></div>
<div class="field"><label>参考图</label><div class="filebox"><input id="images" type="file" accept="image/*" multiple><div class="hint">最多 16 张；文件仅在本地转为请求数据。</div><div class="previews" id="imagePreviews"></div></div></div>
<div class="field"><label>遮罩（可选）</label><div class="filebox"><input id="mask" type="file" accept="image/*"><button class="secondary" id="maskEdit" type="button" style="margin-top:8px">打开画布编辑器</button><canvas id="maskCanvas" hidden></canvas><div class="previews" id="maskPreview"></div></div></div>
<div class="field" id="setupBox" style="display:none"><label>首次连接配置</label><div class="filebox"><input id="setupEndpoint" type="url" placeholder="图片服务器地址，例如 https://api.example.com/v1/images/generations"><input id="setupKey" type="password" placeholder="API Key（只提交到本机服务端，不保存到浏览器）" style="margin-top:8px"><button id="setupButton" style="margin-top:8px">保存连接配置</button><div class="hint">服务端会将配置保存为权限 600 的本地文件。已有环境变量配置时无需填写。</div></div></div>
<div class="field"><label>API Token（可选）</label><input id="token" type="password" placeholder="仅当服务端设置 GPT_PLAYGROUND_API_TOKEN 时填写"><div class="hint">Token 只保存在当前浏览器 localStorage。</div></div>
<div class="checks"><label><input id="async" type="checkbox" checked>后台 Job</label><label><input id="dryRun" type="checkbox">Dry Run</label><label>生成数量 <input id="count" type="number" min="1" max="4" value="1" style="width:62px"></label></div>
<div class="actions"><button id="submit">开始生成</button><button class="secondary" id="clear">清空</button><span class="status" id="status"></span></div>
</div><div><div class="panel results"><h2>结果 <button class="secondary" id="downloadZip" style="float:right;padding:6px 9px;font-size:12px" hidden>下载 ZIP</button></h2><div id="results"><div class="empty">生成结果会出现在这里<br><small>支持图片预览、Job 状态和原始摘要</small></div></div></div><div class="panel history"><h2>最近任务 <button class="secondary" id="refreshHistory" style="float:right;padding:6px 9px;font-size:12px">刷新</button></h2><div class="row"><input id="historyQuery" placeholder="搜索提示词或任务 ID"><button class="secondary" id="galleryButton">画廊</button></div><div class="history-list" id="history"><div class="hint">暂无历史记录</div></div></div></div></section>
</main><script>
const $=s=>document.querySelector(s), api=location.origin;let refs=[],maskRef=null;
function auth(){const t=$('#token').value.trim();if(t)localStorage.setItem('gip-token',t);return t?{'Authorization':'Bearer '+t}:{}}
function headers(){return {'Content-Type':'application/json',...auth()}}
function setStatus(text,kind=''){const x=$('#status');x.textContent=text;x.className='status '+kind}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function readFile(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function preview(input,target,multi=false){const files=[...input.files];target.innerHTML='';const values=[];for(const f of files){const data=await readFile(f);values.push(data);const img=document.createElement('img');img.className='thumb';img.src=data;img.title=f.name;target.appendChild(img)}return multi?values:(values[0]||null)}
async function addDroppedImages(files){refs=[];for(const f of [...files].filter(x=>x.type.startsWith('image/')).slice(0,16))refs.push(await readFile(f));$('#imagePreviews').innerHTML=refs.map(x=>'<img class="thumb" src="'+x+'">').join('')}
function fileFromDataUrl(data,name='mask.png'){const [head,b64]=data.split(',');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));return new File([bytes],name,{type:(head.match(/data:(.*?);/)||[])[1]||'image/png'})}
function openMaskEditor(){const source=refs[0];if(!source)return setStatus('请先选择一张主图作为遮罩底图','bad');const modal=document.createElement('div');modal.className='mask-modal';modal.innerHTML='<div class="mask-card"><b>遮罩编辑器</b><div class="mask-tools"><label>画笔 <input id="brush" type="range" min="4" max="160" value="36"></label><button id="maskClear" class="secondary">清空</button><button id="maskCancel" class="secondary">取消</button><button id="maskSave">使用遮罩</button></div><canvas id="editorCanvas"></canvas><div class="hint">在需要修改的区域涂白；黑色区域保持不变。</div></div>';document.body.appendChild(modal);const c=modal.querySelector('#editorCanvas'),ctx=c.getContext('2d'),img=new Image();img.onload=()=>{const scale=Math.min(1,820/img.width,520/img.height);c.width=Math.max(1,img.width*scale);c.height=Math.max(1,img.height*scale);ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);c.dataset.scale=scale;};img.src=source;let down=false;c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);paint(e)};c.onpointerup=()=>down=false;c.onpointermove=e=>{if(down)paint(e)};function paint(e){const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,+modal.querySelector('#brush').value/2,0,Math.PI*2);ctx.fill()}modal.querySelector('#maskClear').onclick=()=>{ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height)};modal.querySelector('#maskCancel').onclick=()=>modal.remove();modal.querySelector('#maskSave').onclick=()=>{maskRef=c.toDataURL('image/png');$('#maskPreview').innerHTML='<img class="thumb" src="'+maskRef+'" title="canvas-mask.png">';modal.remove();setStatus('遮罩已生成','good')}}
$('#maskEdit').onclick=openMaskEditor;$('#images').onchange=async()=>{refs=await preview($('#images'),$('#imagePreviews'),true)};$('#images').ondrop=async e=>{e.preventDefault();await addDroppedImages(e.dataTransfer.files)};$('#images').ondragover=e=>e.preventDefault();document.addEventListener('paste',async e=>{const f=[...e.clipboardData.files].find(x=>x.type.startsWith('image/'));if(f){await addDroppedImages([f]);setStatus('已从剪贴板读取图片','good')}});$('#mask').onchange=async()=>{maskRef=await preview($('#mask'),$('#maskPreview'))};
async function setupStatus(){try{const r=await fetch(api+'/v1/setup/status',{headers:auth()});const d=await r.json();if(!r.ok)throw Error(d.error);if(!d.configured)$('#setupBox').style.display='block';else $('#setupBox').style.display='none'}catch(e){health(false,e.message)}}
async function setupConnection(){const endpoint=$('#setupEndpoint').value.trim(),key=$('#setupKey').value;if(!endpoint||!key)return setStatus('请填写图片服务器地址和 API Key','bad');$('#setupButton').disabled=true;try{const r=await fetch(api+'/v1/setup',{method:'POST',headers:headers(),body:JSON.stringify({endpoint,api_key:key,model:'gpt-image-2'})});const d=await r.json();if(!r.ok)throw Error(d.error||'保存配置失败');$('#setupKey').value='';$('#setupBox').style.display='none';setStatus('连接配置已保存','good');loadProfiles();checkHealth()}catch(e){setStatus(e.message,'bad')}finally{$('#setupButton').disabled=false}}
async function loadProfiles(){try{const r=await fetch(api+'/v1/profiles',{headers:auth()});const d=await r.json();if(!r.ok)throw Error(d.error);$('#profile').innerHTML=d.profiles.map(p=>`<option value="${esc(p.id)}">${esc(p.name||p.id)}</option>`).join('');if(d.default_profile)$('#profile').value=d.default_profile;health(true)}catch(e){health(false,e.message)}}
function health(ok,msg){$('#healthDot').className='dot '+(ok?'ok':'');$('#healthText').textContent=ok?'API 在线':('API 不可用'+(msg?' · '+msg:''))}
async function checkHealth(){try{const r=await fetch(api+'/healthz',{headers:auth()});const d=await r.json();health(r.ok,d.error)}catch(e){health(false,e.message)}}
function payload(){const mode=$('#mode').value,p={prompt:$('#prompt').value.trim(),profile:$('#profile').value,size:$('#size').value,quality:$('#quality').value,n:+$('#count').value,style:$('#style').value||undefined,images:refs};if(maskRef)p.mask=maskRef;if($('#dryRun').checked)p.dry_run=true;if(mode==='batch'){p.tasks=p.prompt.split(/\n+/).map(x=>({prompt:x.trim(),profile:p.profile,size:p.size,quality:p.quality,style:p.style})).filter(x=>x.prompt);delete p.prompt}return {mode,payload:p}}
function findImages(value,out=[]){if(!value)return out;if(typeof value==='string'){if(value.startsWith('data:image/')||value.startsWith('http://')||value.startsWith('https://')||value.startsWith('minis://')||value.match(/\/var\/minis\/(attachments|workspace)\/[^\s"']+\.(png|jpg|jpeg|webp|gif)/i))out.push(value);return out}if(Array.isArray(value))value.forEach(x=>findImages(x,out));else if(typeof value==='object')Object.values(value).forEach(x=>findImages(x,out));return [...new Set(out)]}
function imageSrc(x){if(x.startsWith('/var/minis/attachments/')||x.startsWith('/var/minis/workspace/')||x.startsWith('/var/minis/mounts/'))return api+'/v1/files?path='+encodeURIComponent(x);return x}
function imageUrl(x){return imageSrc(x)}
async function loadProtectedImage(img,x){try{const r=await fetch(imageUrl(x),{headers:auth()});if(!r.ok)throw Error('图片读取失败');const url=URL.createObjectURL(await r.blob());img.src=url;const link=img.closest('a');if(link)link.href=url}catch(e){img.alt=e.message}}
function render(result){window.lastResult=result;$('#downloadZip').hidden=findImages(result).length===0;const imgs=findImages(result);$('#results').innerHTML=imgs.length?'<div class="cards">'+imgs.map(x=>`<a class="card" href="${esc(imageSrc(x))}" target="_blank"><img data-image-path="${esc(x)}" loading="lazy"><p>${esc(x)}</p></a>`).join('')+'</div>':'<div class="empty">本次任务没有可预览图片<br><small>请查看下方原始摘要</small></div>';imgs.forEach((x,i)=>loadProtectedImage(document.querySelectorAll('[data-image-path]')[i],x));const pre=document.createElement('pre');pre.className='raw';pre.textContent=JSON.stringify(result,null,2);$('#results').appendChild(pre)}
async function downloadZip(){if(!window.lastResult)return;const r=await fetch(api+'/v1/export-zip',{method:'POST',headers:headers(),body:JSON.stringify({result:window.lastResult})});const d=await r.json();if(!r.ok)throw Error(d.error||'ZIP 导出失败');const file=await fetch(api+d.download_url,{headers:auth()});if(!file.ok)throw Error('ZIP 下载失败');const blob=await file.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gpt-image-playground-results.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function poll(id){for(let i=0;i<120;i++){await new Promise(r=>setTimeout(r,1200));const r=await fetch(api+'/v1/jobs/'+encodeURIComponent(id),{headers:auth()});const d=await r.json();if(!r.ok)throw Error(d.error||'Job 查询失败');setStatus('Job '+d.status+' · '+id);if(d.status==='completed'){render(d.result);setStatus('生成完成','good');return}if(d.status==='failed'){render(d);throw Error(d.error||'任务失败')}}throw Error('Job 等待超时')}
async function submit(){const {mode,payload:p}=payload();if(mode==='batch'&&!p.tasks?.length)return setStatus('批量模式需要每行一个非空提示词','bad');if(mode!=='batch'&&!p.prompt)return setStatus('请输入提示词','bad');const endpoint=mode==='batch'?'/v1/batch':mode==='agent'?'/v1/agent':'/v1/generate';p.async=$('#async').checked;$('#submit').disabled=true;setStatus('提交中…');try{const r=await fetch(api+endpoint,{method:'POST',headers:headers(),body:JSON.stringify(p)});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');if(d.job_id){setStatus('Job queued · '+d.job_id);await poll(d.job_id)}else{render(d);setStatus('生成完成','good')}loadHistory()}catch(e){setStatus(e.message,'bad')}finally{$('#submit').disabled=false}}
async function loadGallery(){try{const r=await fetch(api+'/v1/gallery?limit=50',{headers:auth()}),d=await r.json();if(!r.ok)throw Error(d.error);const rows=d.items||[];$('#results').innerHTML=rows.length?'<div class="cards">'+rows.map(x=>`<a class="card" href="${esc(imageSrc(x.path))}" target="_blank"><img data-image-path="${esc(x.path)}" loading="lazy"><p>★ ${esc(x.image_id||'image')}</p></a>`).join('')+'</div>':'<div class="empty">暂无已索引图片</div>';rows.forEach((x,i)=>loadProtectedImage(document.querySelectorAll('[data-image-path]')[i],x.path))}catch(e){setStatus('画廊读取失败：'+e.message,'bad')}}
async function loadHistory(){try{const q=encodeURIComponent($('#historyQuery')?.value||''),r=await fetch(api+'/v1/history?limit=8&q='+q,{headers:auth()});const d=await r.json();if(!r.ok)throw Error(d.error);const rows=d.items||[];$('#history').innerHTML=rows.length?rows.map(x=>`<div class="history-item"><b>${esc(x.task_id||x.id||x.status||'任务')}</b><small>${esc(x.status||'已记录')} · ${esc(x.prompt||x.mode||'')}</small></div>`).join(''):'<div class="hint">暂无历史记录</div>'}catch(e){$('#history').innerHTML='<div class="hint">历史读取失败：'+esc(e.message)+'</div>'}}
$('#submit').onclick=submit;$('#galleryButton').onclick=loadGallery;$('#historyQuery').oninput=()=>loadHistory();$('#setupButton').onclick=setupConnection;$('#downloadZip').onclick=()=>downloadZip().catch(e=>setStatus(e.message,'bad'));$('#refreshHistory').onclick=loadHistory;$('#clear').onclick=()=>{$('#prompt').value='';$('#images').value='';$('#mask').value='';refs=[];maskRef=null;$('#imagePreviews').innerHTML='';$('#maskPreview').innerHTML='';$('#results').innerHTML='<div class="empty">生成结果会出现在这里</div>';setStatus('')};$('#mode').onchange=()=>$('#promptHint').textContent=$('#mode').value==='batch'?'每行一个提示词，提交后并发执行。':$('#mode').value==='agent'?'Agent 会根据目标规划多轮生成。':'描述你想要的画面、主体、构图和风格。';$('#token').value=localStorage.getItem('gip-token')||'';setupStatus();loadProfiles();loadHistory();checkHealth();setInterval(checkHealth,15000);
</script></body></html>
